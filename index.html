<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <!-- ============================================
         ✅ PWA: Web App Manifest
         ============================================ -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- ============================================
         ✅ PWA: Apple Touch Icon for iOS devices
         ============================================ -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- ============================================
         ✅ PWA: iOS Safari meta tags
         ============================================ -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- ============================================
         ✅ VIEWPORT: Fixed for ALL devices
         ============================================ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />

         ❌ TITLE REMOVED - SEOHead.tsx handle karega
         ============================================ -->
    <!-- <title>Free CV Builder &amp; Cover Letter Maker | Adin AI - Best Career Assistant 2026</title> -->
    
    <!-- ============================================
         ✅ PRIMARY SEO: META DESCRIPTION with Keywords
         ============================================ -->
    <meta name="description" content="Create professional CV and cover letter free with Adin AI. Best free CV builder and cover letter maker online. AI-powered resume builder, document management, and career assistant." />
    
    <!-- ============================================
         ✅ SEO: KEYWORDS (for search engines)
         ============================================ -->
    <meta name="keywords" content="free cv builder, free cover letter, best cv builder, best cover letter, ai resume builder, professional cv maker, cover letter generator, career assistant, adin ai, free resume builder, cv creator online, cover letter builder" />
    
    <!-- ============================================
         ✅ SEO: ROBOTS (crawl instructions)
         ============================================ -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large" />
    
    <!-- ============================================
         ✅ SEO: CANONICAL URL
         ============================================ -->
    <link rel="canonical" href="https://adin-ai.com/" />
    
    <!-- ============================================
         ✅ PWA: Theme color for browser
         ============================================ -->
    <meta name="theme-color" content="#8b5cf6" />
    
    <!-- ============================================
         ✅ OPEN GRAPH (Facebook, LinkedIn, etc.)
         ============================================ -->
    <meta property="og:title" content="Free CV Builder &amp; Cover Letter Maker | Adin AI - Best Career Assistant" />
    <meta property="og:description" content="Create professional CV and cover letter free with Adin AI. Best free CV builder and cover letter maker online. AI-powered career assistant." />

    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Adin AI" />
    <meta property="og:locale" content="en_US" />
